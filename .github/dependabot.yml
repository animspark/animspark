version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # playwright is pinned on purpose: it decides which Chromium renders every frame.
    ignore:
      - dependency-name: playwright
    groups:
      minor-and-patch:
        update-types: [minor, patch]
